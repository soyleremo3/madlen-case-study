<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Madlen Carousel</title>
<link href="brandfonts/fonts.css" rel="stylesheet">
<style>
  /* Madlen brand tokens, taken from madlen.io :root (2026-10-05) */
  :root {
    --primary-50: #fdf5ef;
    --primary-100: #fae7d7;
    --primary-200: #f4cba8;
    --primary-500: #d37e24;
    --primary-600: #b96b1d;
    --madlen-purple: #9078dc;
    --purple-soft: #efebfb;
    --iron: #70645e;
    --fg1: #1f2937;
    --bg-card: #ffffff;
    --bg-tertiary: #fffdf9;
    --border: rgba(112,100,94,.16);
    --mint: #059669;
    --mint-soft: #e3f5ee;
    --shadow-lg: 0 18px 50px rgba(112,100,94,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--primary-50); }
  body { font-family: "Instrument Sans", system-ui, sans-serif; color: var(--fg1); -webkit-font-smoothing: antialiased; }

  .slide { position: relative; width: 1080px; height: 1350px; padding: 80px 88px 70px; display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(circle at 96% 4%, var(--primary-100) 0 230px, transparent 231px),
      radial-gradient(circle at 0% 100%, var(--purple-soft) 0 250px, transparent 251px),
      var(--primary-50); }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 54px; position: relative; z-index: 2; }
  .logo { height: 46px; }
  .tag { display: inline-flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 600; color: var(--primary-600); background: var(--bg-card); border: 2px solid var(--primary-200); padding: 10px 24px; border-radius: 999px; }
  .tag img { width: 30px; height: 30px; }

  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 136px; line-height: .98; letter-spacing: -1.5px; position: relative; z-index: 2; }
  h1.mid { font-size: 120px; }
  h1 em { font-style: italic; color: var(--primary-500); }
  .hl { background: var(--primary-500); color: #fffdf9; padding: 0 22px 8px; border-radius: 16px; display: inline-block; line-height: 1.02; transform: rotate(-1.2deg); }
  .hl-p { background: var(--madlen-purple); color: #fffdf9; padding: 0 22px 8px; border-radius: 16px; display: inline-block; line-height: 1.02; transform: rotate(1deg); }

  .sub { font-size: 40px; line-height: 1.35; color: var(--iron); font-weight: 500; margin-top: 30px; max-width: 880px; position: relative; z-index: 2; }
  .sub strong { color: var(--fg1); font-weight: 700; }

  .bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 26px; color: var(--iron); font-weight: 600; position: relative; z-index: 2; }
  .swipe { display: flex; align-items: center; gap: 12px; color: var(--primary-600); }
  .swipe svg { width: 40px; height: 40px; }
  .foot { font-size: 22px; color: var(--iron); font-weight: 500; }

  .doodle { position: absolute; pointer-events: none; z-index: 1; }
  .mascot { position: absolute; z-index: 4; filter: drop-shadow(0 18px 24px rgba(112,100,94,.25)); }

  /* slide 1 */
  .stack { position: relative; height: 470px; margin-top: 40px; }
  .paper { position: absolute; width: 500px; height: 380px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 44px; }
  .paper .ln { height: 14px; background: #efe7df; border-radius: 8px; margin-bottom: 26px; }
  .paper .ln.red { background: transparent; border-bottom: 5px solid #e2574c; border-radius: 0; height: 18px; width: 60%; margin-bottom: 22px; }
  .p1 { left: 20px; top: 70px; transform: rotate(-7deg); }
  .p2 { left: 110px; top: 40px; transform: rotate(4deg); }
  .p3 { left: 200px; top: 70px; transform: rotate(-2deg); }
  .sticky { position: absolute; left: 560px; top: 0; z-index: 3; width: 270px; background: #ffe6a6; padding: 24px 28px; border-radius: 6px; transform: rotate(6deg); box-shadow: 0 14px 30px rgba(112,100,94,.2); }
  .sticky .t { white-space: nowrap; font-size: 64px; font-family: "Instrument Serif", serif; line-height: 1; }
  .sticky .s { font-size: 26px; color: #7a5b12; margin-top: 8px; font-weight: 600; }

  /* slide 2 */
  .math { margin-top: 90px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 32px; padding: 52px 60px; box-shadow: var(--shadow-lg); position: relative; z-index: 2; }
  .math .eq { font-family: "Instrument Serif", serif; font-size: 110px; line-height: 1; }
  .math .eq span { color: var(--iron); }
  .math .res { font-family: "Instrument Serif", serif; font-size: 150px; line-height: 1; color: var(--primary-500); margin-top: 14px; letter-spacing: -1px; }
  .bars { display: flex; gap: 10px; margin-top: 40px; flex-wrap: wrap; }
  .bars i { width: 34px; height: 46px; border-radius: 8px; background: var(--primary-100); border: 2px solid var(--primary-200); }
  .bars i.on { background: var(--primary-500); border-color: var(--primary-500); }

  /* app mock */
  .app { margin-top: 46px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 32px; box-shadow: var(--shadow-lg); overflow: hidden; position: relative; z-index: 2; }
  .app-h { display: flex; align-items: center; justify-content: space-between; padding: 24px 32px; border-bottom: 2px solid var(--border); background: var(--bg-tertiary); }
  .app-h .t { font-size: 30px; font-weight: 700; display: flex; gap: 14px; align-items: center; }
  .app-h .t img { width: 36px; height: 36px; }
  .pill { font-size: 22px; font-weight: 700; padding: 8px 18px; border-radius: 999px; }
  .pill.ok { background: var(--mint-soft); color: var(--mint); }
  .pill.wait { background: var(--purple-soft); color: #5f48c2; }
  .app-b { padding: 28px 32px 32px; }
  .file { display: flex; align-items: center; gap: 16px; background: var(--primary-50); border: 2px dashed var(--primary-200); border-radius: 18px; padding: 18px 22px; font-size: 26px; font-weight: 600; }
  .file .ic { width: 66px; height: 56px; flex: none; background: #2563eb; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 700; display: grid; place-items: center; }
  .file small { display: block; color: var(--iron); font-weight: 500; font-size: 22px; margin-top: 2px; }
  .chips { display: flex; gap: 12px; margin: 22px 0 6px; }
  .chip { font-size: 22px; font-weight: 700; color: var(--primary-600); background: var(--primary-100); padding: 8px 18px; border-radius: 999px; }
  .student { margin-top: 22px; border: 2px solid var(--border); border-radius: 20px; padding: 24px 26px; }
  .st-h { display: flex; align-items: center; justify-content: space-between; }
  .who { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 700; }
  .av { width: 52px; height: 52px; border-radius: 50%; background: var(--purple-soft); color: #5f48c2; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 20px 0 18px; }
  .sc { font-size: 21px; font-weight: 600; color: var(--iron); }
  .sc .bar { height: 12px; border-radius: 8px; background: var(--primary-100); margin-top: 8px; overflow: hidden; }
  .sc .bar i { display: block; height: 100%; background: var(--primary-500); border-radius: 8px; }
  .fb { font-size: 25px; line-height: 1.45; background: var(--bg-tertiary); border-left: 6px solid var(--madlen-purple); padding: 16px 20px; border-radius: 10px; }
  .caret { display: inline-block; width: 3px; height: 30px; background: var(--fg1); vertical-align: -6px; margin-left: 2px; }
  .actions { display: flex; gap: 16px; margin-top: 22px; justify-content: flex-end; }
  .btn { font-size: 25px; font-weight: 700; padding: 16px 28px; border-radius: 16px; }
  .btn.o { border: 2px solid var(--border); background: var(--bg-card); }
  .btn.f { background: var(--primary-500); color: #fffdf9; box-shadow: 0 10px 20px rgba(211,126,36,.3); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 34px; position: relative; z-index: 2; }
  .step { font-size: 27px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
  .step b { width: 50px; height: 50px; border-radius: 50%; background: var(--fg1); color: var(--primary-50); display: grid; place-items: center; font-size: 24px; flex: none; }

  .ticks { margin-top: 32px; display: grid; gap: 16px; position: relative; z-index: 2; }
  .tick { font-size: 32px; font-weight: 600; display: flex; gap: 16px; align-items: center; }
  .tick svg { width: 40px; height: 40px; flex: none; }
  .note { margin-top: 28px; display: flex; gap: 14px; align-items: center; font-size: 23px; color: #5f48c2; background: var(--purple-soft); padding: 16px 22px; border-radius: 16px; font-weight: 600; position: relative; z-index: 2; }
  .note svg { width: 34px; height: 34px; flex: none; }

  /* slide 5 */
  .cta { margin-top: 56px; display: inline-flex; align-self: flex-start; align-items: center; gap: 18px; background: var(--primary-500); color: #fffdf9; font-size: 42px; font-weight: 700; padding: 30px 46px; border-radius: 26px; box-shadow: 0 18px 36px rgba(211,126,36,.35); position: relative; z-index: 2; }
  .cta svg { width: 44px; height: 44px; }
  .social { display: flex; gap: 18px; margin-top: 36px; position: relative; z-index: 2; }
  .social span { display: inline-flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; background: var(--bg-card); border: 2px solid var(--border); padding: 16px 26px; border-radius: 999px; }
  .social svg { width: 34px; height: 34px; }
  .sign { font-family: "Instrument Serif", serif; font-style: italic; font-size: 46px; color: var(--primary-600); }
</style>
</head>
<body>
<div id="root"></div>

<script>
const ICON = {
  arrow: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h24M22 10l10 10-10 10"/></svg>',
  check: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#e3f5ee"/><path d="M12 20.5l5.5 5.5L28 15" fill="none" stroke="#059669" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  shield: '<svg viewBox="0 0 34 34" fill="none" stroke="#5f48c2" stroke-width="2.6" stroke-linejoin="round"><path d="M17 3l11 4v9c0 7-5 12-11 15C11 28 6 23 6 16V7z"/><path d="M12 17l4 4 7-8" stroke-linecap="round"/></svg>',
  bookmark: '<svg viewBox="0 0 34 34" fill="none" stroke="#1f2937" stroke-width="2.8" stroke-linejoin="round"><path d="M9 4h16v26l-8-6-8 6z"/></svg>',
  send: '<svg viewBox="0 0 34 34" fill="none" stroke="#1f2937" stroke-width="2.8" stroke-linejoin="round"><path d="M30 4L4 15l11 4 4 11z"/><path d="M15 19L30 4"/></svg>',
  sparkle: (c, s) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M20 2c1.5 9 4 12.5 18 18-14 5.5-16.5 9-18 18-1.5-9-4-12.5-18-18 14-5.5 16.5-9 18-18z" fill="${c}"/></svg>`,
  heart: (c, s) => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M20 34S5 25 5 14.5C5 9 9 6 13 6c3.5 0 5.7 2 7 4.5C21.3 8 23.5 6 27 6c4 0 8 3 8 8.5C35 25 20 34 20 34z"/></svg>`
};
const LOGO = '<img class="logo" src="brand/madlen-logo.svg" alt="Madlen">';
const MASCOT = (style) => `<img class="mascot" src="brand/madlenMadeleineMascot.webp" alt="" style="${style}">`;

const T = {
  tr: {
    tool: "Kompozisyon Değerlendirme",
    swipe: "Kaydır",
    s1: { h: 'Pazar akşamı.<br>Masada<br><span class="hl">32 kompozisyon.</span>', sticky: ["21:40", "7 / 32 bitti"], sub: "Tanıdık geldi mi?" },
    s2: { eq: '32 <span>×</span> 10 dk', res: "= 5 saat 20 dk", sub: "Bir kompozisyonu dikkatle okuyup geri bildirim yazmak ortalama <strong>10 dakika</strong> sürüyor.*", sub2: "Ve 32. kompozisyon da ilki kadar <strong>özeni hak ediyor.</strong>", foot: "*Madlen İçgörü Raporu, 2026" },
    s3: { h: 'Madlen okur,<br><em>taslağı</em> hazırlar.', file: "7-B_kompozisyonlar.docx", fileSub: "32 kompozisyon yüklendi", ready: "32 / 32 hazır", chips: ["Yapı", "Dil", "İçerik"], student: "Ada Y.", fb: "Giriş paragrafın konuyu net tanıtıyor. Gelişme bölümünde iddianı bir örnekle desteklersen yazın çok daha ikna edici olur.", steps: ["Yükle", "Rubriği seç", "Taslağı incele"] },
    s4: { h: 'Son kararı<br><span class="hl-p">siz</span> verirsiniz.', wait: "Onayınızı bekliyor", edit: "Düzenle", ok: "Onayla ve paylaş", ticks: ["Her öğrenciye aynı rubrik, aynı özen", "Puanı ve yorumu siz düzenlersiniz", "Öğrenciyle paylaşmaya hazır özet"], note: "Öğrenci ürünlerini YZ ile değerlendirmeden önce YAZEK etik beyanınızı yapmayı unutmayın." },
    s5: { h: 'Pazar akşamınızı<br><span class="hl">geri alın.</span>', sub: "Kompozisyonlar Madlen'de taslağa dönüşsün; <strong>son söz ve özen sizde kalsın.</strong>", cta: "Ücretsiz deneyin · madlen.io", save: "Kaydet", share: "Zümrene gönder", sign: "Great Teachers, Great Futures." }
  },
  en: {
    tool: "Essay Marking",
    swipe: "Swipe",
    s1: { h: 'Sunday evening.<br>On the desk:<br><span class="hl">32 essays.</span>', sticky: ["9:40 pm", "7 / 32 done"], sub: "Sound familiar?" },
    s2: { eq: '32 <span>×</span> 10 min', res: "= 5 h 20 min", sub: "Reading an essay carefully and writing feedback takes about <strong>10 minutes.</strong>*", sub2: "And essay #32 deserves <strong>the same care as #1.</strong>", foot: "*Madlen Insight Report, 2026" },
    s3: { h: 'Madlen reads.<br>You get a <em>draft.</em>', file: "7B_essays.docx", fileSub: "32 essays uploaded", ready: "32 / 32 ready", chips: ["Structure", "Language", "Content"], student: "Ada Y.", fb: "Your introduction presents the topic clearly. Back up your main claim with an example in the body and your essay will be far more convincing.", steps: ["Upload", "Pick a rubric", "Review drafts"] },
    s4: { h: '<span class="hl-p">You</span> make<br>the final call.', wait: "Awaiting your approval", edit: "Edit", ok: "Approve & share", ticks: ["Same rubric, same care for every student", "You adjust every score and comment", "A short summary, ready to share"], note: "In Türkiye? File your YAZEK ethics declaration before using AI on student work." },
    s5: { h: 'Take your<br>Sunday evening<br><span class="hl">back.</span>', sub: "Let Madlen turn essays into drafts; <strong>the final word and the care stay with you.</strong>", cta: "Try it free · madlen.io", save: "Save", share: "Send to your department", sign: "Great Teachers, Great Futures." }
  }
};

const p = new URLSearchParams(location.search);
const lang = p.get("lang") === "en" ? "en" : "tr";
const n = Math.min(5, Math.max(1, parseInt(p.get("slide") || "1", 10)));
const t = T[lang];
document.documentElement.lang = lang;

const tagEl = `<div class="tag"><img src="brand/madlen-icon.png" alt="">${t.tool}</div>`;
const topBar = (withTag) => `<div class="top">${LOGO}${withTag ? tagEl : ""}</div>`;
const bottom = (left) => `<div class="bottom"><div class="foot">${left || ""}</div>${n < 5 ? `<div class="swipe">${t.swipe} ${ICON.arrow}</div>` : ""}</div>`;

const studentCard = (withActions) => `
  <div class="student">
    <div class="st-h"><div class="who"><div class="av">AY</div>${t.s3.student}</div>
      ${withActions ? `<span class="pill wait">${t.s4.wait}</span>` : ""}</div>
    <div class="scores">
      ${t.s3.chips.map((c, i) => `<div class="sc">${c} · ${[3, 4, 3][i]}/4<div class="bar"><i style="width:${[75, 100, 75][i]}%"></i></div></div>`).join("")}
    </div>
    <div class="fb">${t.s3.fb}${withActions ? '<span class="caret"></span>' : ""}</div>
    ${withActions ? `<div class="actions"><span class="btn o">${t.s4.edit}</span><span class="btn f">${t.s4.ok}</span></div>` : ""}
  </div>`;

const slides = {
  1: () => `${topBar(true)}<h1>${t.s1.h}</h1>
    <div class="stack">
      <div class="paper p1"><div class="ln"></div><div class="ln"></div><div class="ln red"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div>
      <div class="paper p2"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln red"></div><div class="ln" style="width:55%"></div></div>
      <div class="paper p3"><div class="ln"></div><div class="ln red"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:40%"></div></div>
      <div class="sticky"><div class="t">${t.s1.sticky[0]}</div><div class="s">${t.s1.sticky[1]}</div></div>
    </div>
    <div class="sub" style="margin-top:26px"><strong>${t.s1.sub}</strong></div>
    ${bottom()}
    ${MASCOT("width:250px;right:70px;bottom:130px;transform:rotate(8deg)")}
    <div class="doodle" style="right:110px;top:330px">${ICON.sparkle("#9078dc", 54)}</div>
    <div class="doodle" style="right:200px;top:270px">${ICON.sparkle("#d37e24", 30)}</div>`,
  2: () => `${topBar(true)}
    <div class="math">
      <div class="eq">${t.s2.eq}</div>
      <div class="res">${t.s2.res}</div>
      <div class="bars">${Array.from({ length: 32 }, (_, i) => `<i class="${i < 7 ? "on" : ""}"></i>`).join("")}</div>
    </div>
    <div class="sub">${t.s2.sub}</div>
    <div class="sub" style="margin-top:22px">${t.s2.sub2}</div>
    ${MASCOT("width:190px;right:90px;bottom:120px;transform:rotate(-8deg)")}
    ${bottom(t.s2.foot)}
    <div class="doodle" style="right:300px;bottom:150px">${ICON.heart("#d37e24", 54)}</div>`,
  3: () => `${topBar(false)}<h1 class="mid">${t.s3.h}</h1>
    <div class="app">
      <div class="app-h"><div class="t"><img src="brand/madlen-icon.png" alt="">${t.tool}</div><span class="pill ok">✓ ${t.s3.ready}</span></div>
      <div class="app-b">
        <div class="file"><div class="ic">DOCX</div><div>${t.s3.file}<small>${t.s3.fileSub}</small></div></div>
        <div class="chips">${t.s3.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
        ${studentCard(false)}
      </div>
    </div>
    <div class="steps">${t.s3.steps.map((s, i) => `<div class="step"><b>${i + 1}</b>${s}</div>`).join("")}</div>
    ${bottom()}
    <div class="doodle" style="right:100px;top:190px">${ICON.sparkle("#9078dc", 50)}</div>`,
  4: () => `${topBar(false)}<h1 class="mid">${t.s4.h}</h1>
    <div class="app" style="margin-top:44px"><div class="app-b">${studentCard(true)}</div></div>
    <div class="ticks">${t.s4.ticks.map(x => `<div class="tick">${ICON.check}${x}</div>`).join("")}</div>
    <div class="note">${ICON.shield}${t.s4.note}</div>
    ${bottom()}`,
  5: () => `${topBar(true)}<h1 style="font-size:168px;margin-top:20px">${t.s5.h}</h1>
    <div class="sub">${t.s5.sub}</div>
    <div class="cta">${t.s5.cta} ${ICON.arrow}</div>
    <div class="social"><span>${ICON.bookmark}${t.s5.save}</span><span>${ICON.send}${t.s5.share}</span></div>
    ${bottom(`<span class="sign">${t.s5.sign}</span>`)}
    ${MASCOT("width:250px;right:60px;bottom:110px;transform:rotate(-6deg)")}
    <div class="doodle" style="right:300px;bottom:330px">${ICON.sparkle("#d37e24", 54)}</div>
    <div class="doodle" style="right:60px;bottom:470px">${ICON.heart("#9078dc", 70)}</div>`
};

document.getElementById("root").innerHTML = `<section class="slide">${slides[n]()}</section>`;
</script>
</body>
</html>
